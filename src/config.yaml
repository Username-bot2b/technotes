site:
  name: technotes
  site: 'https://tech-notes.vercel.app'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Astro 主题（UI 皮肤）名称，与站点名 site.name 分开配置
theme:
  name: PaperPlain

# Default SEO metadata
metadata:
  title:
    default: technotes
    template: '%s — technotes'
  description: '编程学习笔记与技术文章，使用 Astro 与 PaperPlain 主题构建。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: technotes
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

    # Giscus：使用与本项目相同的 GitHub 源码仓库（Discussions 作为评论存储）
    # 1) 在 GitHub 开启 Discussions  2) 安装 https://github.com/apps/giscus
    # 3) 运行: npm run giscus:setup -- your-user/technotes
    comments:
      enabled: true
      repo: 'Username-bot2b/technotes'
      repoId: 'R_kgDOUySlqQ'
      category: 'Announcements'
      categoryId: 'DIC_kwDOUySlqc4DGsum '
      mapping: pathname
      strict: false
      reactionsEnabled: true
      emitMetadata: false
      inputPosition: top
      lang: zh-CN

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  # 明暗色偏好（system / light / dark），不是主题包名称
  theme: 'system'
